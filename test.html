<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>Kult — тест собственного плеера</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
				background: #050505;
				color: #f5f5f7;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 24px;
				background: radial-gradient(circle at 50% -20%, rgba(80, 80, 90, 0.34), transparent 42%), #050505;
			}

			button,
			input {
				font: inherit;
			}

			.page {
				width: min(1180px, 100%);
			}

			.player {
				position: relative;
				overflow: hidden;
				width: 100%;
				aspect-ratio: 16 / 9;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 24px;
				background: #000;
				box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
				isolation: isolate;
			}

			video {
				width: 100%;
				height: 100%;
				display: block;
				object-fit: contain;
				background: #000;
			}

			.player[data-state="loading"] video,
			.player[data-state="error"] video {
				filter: blur(16px) brightness(0.48);
				transform: scale(1.035);
			}

			.shade {
				position: absolute;
				inset: 0;
				z-index: 1;
				pointer-events: none;
				background: linear-gradient(180deg, transparent 48%, rgba(0, 0, 0, 0.82));
				opacity: 0;
				transition: opacity 0.2s ease;
			}

			.player[data-controls="true"] .shade {
				opacity: 1;
			}

			.player[data-state="playing"][data-controls="false"] {
				cursor: none;
			}

			.movie-title {
				position: absolute;
				z-index: 3;
				top: 20px;
				left: 22px;
				max-width: calc(100% - 44px);
				margin: 0;
				overflow: hidden;
				color: #fff;
				font-size: clamp(18px, 2.7vw, 32px);
				font-weight: 700;
				letter-spacing: -0.035em;
				line-height: 1.1;
				opacity: 0;
				pointer-events: none;
				text-overflow: ellipsis;
				text-shadow: 0 2px 18px rgba(0, 0, 0, 0.72);
				transition: opacity 0.2s ease;
				white-space: nowrap;
			}

			.player[data-controls="true"] .movie-title,
			.player[data-state="paused"] .movie-title {
				opacity: 1;
			}

			.state {
				position: absolute;
				inset: 0;
				z-index: 4;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 16px;
				padding: 28px;
				text-align: center;
				background: rgba(0, 0, 0, 0.28);
				transition:
					opacity 0.2s ease,
					visibility 0.2s ease;
			}

			.player[data-state="ready"] .state,
			.player[data-state="playing"] .state,
			.player[data-state="paused"] .state {
				visibility: hidden;
				opacity: 0;
				pointer-events: none;
			}

			.spinner {
				width: 34px;
				height: 34px;
				border: 3px solid rgba(255, 255, 255, 0.18);
				border-top-color: #fff;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}

			.player[data-state="error"] .spinner {
				display: none;
			}

			.state strong {
				font-size: clamp(18px, 2.2vw, 24px);
				letter-spacing: -0.02em;
			}

			.state p {
				max-width: 600px;
				margin: -8px 0 0;
				color: #c7c7cc;
				line-height: 1.45;
			}

			.retry {
				display: none;
				min-height: 42px;
				padding: 0 18px;
				border: 0;
				border-radius: 999px;
				background: #fff;
				color: #111;
				font-weight: 700;
				cursor: pointer;
			}

			.player[data-state="error"] .retry {
				display: block;
			}

			.center-play {
				position: absolute;
				inset: 50% auto auto 50%;
				z-index: 3;
				width: 72px;
				height: 72px;
				translate: -50% -50%;
				display: grid;
				place-items: center;
				border: 1px solid rgba(255, 255, 255, 0.25);
				border-radius: 50%;
				background: rgba(18, 18, 20, 0.68);
				color: #fff;
				font-size: 28px;
				backdrop-filter: blur(18px);
				cursor: pointer;
				transition:
					scale 0.18s ease,
					opacity 0.18s ease;
			}

			.center-play:hover {
				scale: 1.06;
			}
			.player[data-state="loading"] .center-play,
			.player[data-state="error"] .center-play,
			.player[data-state="playing"] .center-play {
				opacity: 0;
				pointer-events: none;
			}

			.controls {
				position: absolute;
				z-index: 3;
				right: 0;
				bottom: 0;
				left: 0;
				display: grid;
				gap: 12px;
				padding: 48px 22px 18px;
				opacity: 0;
				pointer-events: none;
				translate: 0 8px;
				transition:
					opacity 0.2s ease,
					translate 0.2s ease;
			}

			.player[data-controls="true"] .controls,
			.player[data-state="paused"] .controls {
				opacity: 1;
				pointer-events: auto;
				translate: 0;
			}

			.timeline {
				width: 100%;
				height: 4px;
				margin: 0;
				accent-color: #fff;
				cursor: pointer;
			}

			.control-row {
				display: flex;
				align-items: center;
				gap: 14px;
			}

			.icon-button {
				width: 38px;
				height: 38px;
				padding: 0;
				border: 0;
				background: transparent;
				color: #fff;
				font-size: 20px;
				cursor: pointer;
			}

			.time {
				min-width: 112px;
				color: #f5f5f7;
				font-size: 13px;
				font-variant-numeric: tabular-nums;
			}

			.volume {
				width: 86px;
				accent-color: #fff;
			}

			.spacer {
				flex: 1;
			}

			.reaction-layer {
				position: absolute;
				inset: 0;
				z-index: 5;
				overflow: hidden;
				pointer-events: none;
			}

			.reaction-float {
				--drift: 0px;
				position: absolute;
				right: var(--right, 18px);
				bottom: 78px;
				display: grid;
				width: 54px;
				height: 54px;
				place-items: center;
				padding: 0;
				border: 1px solid rgba(255, 255, 255, 0.16);
				border-radius: 999px;
				background: rgba(20, 20, 22, 0.72);
				box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
				backdrop-filter: blur(18px) saturate(150%);
				animation: reaction-rise 3.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
				will-change: transform, opacity;
			}

			.reaction-float__emoji {
				font-size: clamp(24px, 3vw, 34px);
				line-height: 1;
			}

			.reaction-panel {
				position: absolute;
				z-index: 7;
				right: 18px;
				bottom: 68px;
				width: max-content;
				max-width: calc(100% - 36px);
				padding: 8px;
				border: 1px solid rgba(255, 255, 255, 0.15);
				border-radius: 18px;
				background: rgba(22, 22, 24, 0.84);
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
				backdrop-filter: blur(24px) saturate(160%);
			}

			.reaction-panel[hidden] {
				display: none;
			}

			.reaction-options {
				display: flex;
				flex-wrap: nowrap;
				gap: 5px;
				overflow-x: auto;
				scrollbar-width: none;
			}

			.reaction-options::-webkit-scrollbar {
				display: none;
			}

			.reaction-option {
				display: grid;
				flex: 0 0 38px;
				width: 38px;
				height: 38px;
				place-items: center;
				padding: 0;
				border: 0;
				border-radius: 11px;
				background: transparent;
				font-size: 24px;
				cursor: pointer;
				transition:
					background 0.16s ease,
					scale 0.16s ease;
			}

			.reaction-option:hover {
				background: rgba(255, 255, 255, 0.1);
				scale: 1.08;
			}

			.player-notices {
				position: absolute;
				z-index: 6;
				top: 18px;
				right: 18px;
				display: grid;
				justify-items: end;
				gap: 8px;
				pointer-events: none;
			}

			.player-notice {
				max-width: min(360px, calc(100vw - 36px));
				padding: 11px 14px;
				border: 1px solid rgba(255, 255, 255, 0.14);
				border-radius: 14px;
				background: rgba(22, 22, 24, 0.78);
				color: #fff;
				box-shadow: 0 14px 40px rgba(0, 0, 0, 0.38);
				font-size: clamp(12px, 1.5vw, 14px);
				font-weight: 600;
				backdrop-filter: blur(20px) saturate(150%);
				animation: notice-in 3.2s ease forwards;
			}

			.badge {
				padding: 5px 9px;
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.13);
				color: #e5e5ea;
				font-size: 12px;
				backdrop-filter: blur(12px);
			}

			.quality-select {
				max-width: 142px;
				border: 0;
				outline: none;
				color: #e5e5ea;
				cursor: pointer;
				appearance: auto;
			}

			.quality-select option {
				background: #202023;
				color: #fff;
			}

			.voice-select {
				max-width: min(190px, 28vw);
			}

			@keyframes spin {
				to {
					rotate: 360deg;
				}
			}
			@keyframes reaction-rise {
				0% {
					opacity: 0;
					transform: translate3d(0, 12px, 0) scale(0.82);
				}
				12% {
					opacity: 1;
					transform: translate3d(0, 0, 0) scale(1);
				}
				76% {
					opacity: 1;
				}
				100% {
					opacity: 0;
					transform: translate3d(var(--drift), -270px, 0) scale(0.94);
				}
			}
			@keyframes notice-in {
				0% {
					opacity: 0;
					transform: translate3d(14px, 0, 0);
				}
				12%,
				78% {
					opacity: 1;
					transform: translate3d(0, 0, 0);
				}
				100% {
					opacity: 0;
					transform: translate3d(0, -8px, 0);
				}
			}

			@media (max-width: 680px) {
				body {
					padding: 12px;
				}
				.player {
					border-radius: 16px;
				}
				.movie-title {
					top: 14px;
					left: 14px;
					max-width: calc(100% - 28px);
				}
				.controls {
					padding-inline: 12px;
				}
				.volume {
					display: none;
				}
				.reaction-panel {
					right: 10px;
					bottom: 62px;
				}
				.reaction-float {
					bottom: 68px;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.001ms !important;
					transition-duration: 0.001ms !important;
				}
			}
		</style>
	</head>
	<body>
		<main class="page">
			<section id="player" class="player" data-state="loading" data-controls="true">
				<video id="video" playsinline preload="metadata"></video>
				<div class="shade"></div>
				<h1 id="movie-title" class="movie-title"></h1>
				<div id="reaction-layer" class="reaction-layer" aria-live="polite"></div>
				<div id="player-notices" class="player-notices" aria-live="polite"></div>

				<div class="state" role="status" aria-live="polite">
					<span class="spinner" aria-hidden="true"></span>
					<strong id="state-title">Получаем свежий поток…</strong>
					<p id="state-description">Ссылка на видео не хранится и создаётся заново для этой сессии.</p>
					<button id="retry" class="retry" type="button">Повторить</button>
				</div>

				<button id="center-play" class="center-play" type="button" aria-label="Воспроизвести">▶</button>

				<div id="reaction-panel" class="reaction-panel" hidden>
					<div class="reaction-options" aria-label="Реакции">
						<button class="reaction-option" type="button" data-reaction="🤡" aria-label="Клоун">🤡</button>
						<button class="reaction-option" type="button" data-reaction="❤️" aria-label="Сердце">❤️</button>
						<button class="reaction-option" type="button" data-reaction="😱" aria-label="Удивление">😱</button>
						<button class="reaction-option" type="button" data-reaction="🔥" aria-label="Огонь">🔥</button>
						<button class="reaction-option" type="button" data-reaction="🤟" aria-label="Рокебол">🤟</button>
						<button class="reaction-option" type="button" data-reaction="😢" aria-label="Грусть">😢</button>
						<button class="reaction-option" type="button" data-reaction="🏳️‍🌈" aria-label="No homo">🏳️‍🌈</button>
					</div>
				</div>

				<div class="controls">
					<input id="timeline" class="timeline" type="range" min="0" max="100" value="0" step="0.01" aria-label="Позиция видео" />
					<div class="control-row">
						<button id="play" class="icon-button" type="button" aria-label="Воспроизвести">▶</button>
						<span id="time" class="time">00:00 / 00:00</span>
						<input id="volume" class="volume" type="range" min="0" max="1" value="0.8" step="0.05" aria-label="Громкость" />
						<span class="spacer"></span>
						<select id="voice" class="badge quality-select voice-select" aria-label="Озвучка">
							<option>Озвучка</option>
						</select>
						<select id="quality" class="badge quality-select" aria-label="Качество видео">
							<option value="auto">Авто</option>
						</select>
						<button id="reaction-toggle" class="icon-button" type="button" aria-label="Открыть реакции" aria-expanded="false">☺</button>
						<button id="fullscreen" class="icon-button" type="button" aria-label="На весь экран">⛶</button>
					</div>
				</div>
			</section>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
		<script>
			const KINOPOISK_ID = "467293";
			const pageParams = new URLSearchParams(location.search);
			const resolverOverride = pageParams.get("resolver");
			const RESOLVER_ORIGIN =
				resolverOverride || (location.port === "8787" ? location.origin : `${location.protocol}//${location.hostname}:8787`);

			const elements = {
				player: document.querySelector("#player"),
				video: document.querySelector("#video"),
				title: document.querySelector("#movie-title"),
				stateTitle: document.querySelector("#state-title"),
				stateDescription: document.querySelector("#state-description"),
				retry: document.querySelector("#retry"),
				centerPlay: document.querySelector("#center-play"),
				play: document.querySelector("#play"),
				timeline: document.querySelector("#timeline"),
				volume: document.querySelector("#volume"),
				time: document.querySelector("#time"),
				voice: document.querySelector("#voice"),
				quality: document.querySelector("#quality"),
				reactionLayer: document.querySelector("#reaction-layer"),
				reactionPanel: document.querySelector("#reaction-panel"),
				reactionToggle: document.querySelector("#reaction-toggle"),
				playerNotices: document.querySelector("#player-notices"),
				fullscreen: document.querySelector("#fullscreen"),
			};

			let hls = null;
			let controlsTimer = null;
			let refreshAttempted = false;
			let reactionSocket = null;
			let reactionReconnectTimer = null;
			let lastReactionAt = 0;
			let qualityPreference = sessionStorage.getItem("kult-test-quality") || "max";
			let voicePreference = sessionStorage.getItem(`kult-test-voice:${KINOPOISK_ID}`) || "";

			const reactionChannelId = pageParams.get("room") || `movie-${KINOPOISK_ID}`;
			const reactionUserId = sessionStorage.getItem("kult-test-user-id") || crypto.randomUUID();
			sessionStorage.setItem("kult-test-user-id", reactionUserId);

			function setState(state, title, description = "") {
				elements.player.dataset.state = state;
				if (title) elements.stateTitle.textContent = title;
				elements.stateDescription.textContent = description;
			}

			function formatTime(seconds) {
				if (!Number.isFinite(seconds)) return "00:00";
				const value = Math.max(0, Math.floor(seconds));
				const hours = Math.floor(value / 3600);
				const minutes = Math.floor((value % 3600) / 60);
				const secs = value % 60;
				return hours
					? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`
					: `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
			}

			async function fetchJson(url, options) {
				let response;
				try {
					response = await fetch(url, options);
				} catch (error) {
					const target = new URL(url);
					throw new Error(`Не удалось получить ${target.hostname}${target.pathname}: ${error?.message || error}`);
				}
				const payload = await response.json().catch(() => null);
				if (!response.ok) throw new Error(payload?.error || `HTTP ${response.status}: ${new URL(url).hostname}`);
				return payload;
			}

			async function resolveMovie() {
				const resolverUrl = new URL("/api/test-player", RESOLVER_ORIGIN);
				resolverUrl.searchParams.set("kinopoisk", KINOPOISK_ID);
				return fetchJson(resolverUrl);
			}

			function rewriteProviderUrl(value) {
				const url = new URL(value);
				if (url.hostname === "gorodyshka.link" && /^\/\d+\//.test(url.pathname)) {
					url.pathname = `/content-router/r${url.pathname}`;
				}
				return url.href;
			}

			function proxyStreamUrl(value) {
				const proxy = new URL("/api/test-player/media", RESOLVER_ORIGIN);
				proxy.searchParams.set("url", rewriteProviderUrl(value));
				return proxy.href;
			}

			function createProviderLoader() {
				return class ProviderLoader extends Hls.DefaultConfig.loader {
					load(context, config, callbacks) {
						context.url = rewriteProviderUrl(context.url);
						super.load(context, config, callbacks);
					}
				};
			}

			function attachStream(url, resumeAt = 0) {
				if (!window.Hls?.isSupported()) {
					throw new Error("Браузер не поддерживает HLS через MediaSource");
				}

				hls?.destroy();
				hls = new Hls({
					loader: createProviderLoader(),
					enableWorker: true,
					lowLatencyMode: false,
					backBufferLength: 90,
					maxBufferLength: 60,
					maxMaxBufferLength: 120,
					capLevelToPlayerSize: false,
					abrBandWidthFactor: 0.72,
					abrBandWidthUpFactor: 0.55,
					abrEwmaFastVoD: 6,
					abrEwmaSlowVoD: 20,
				});

				hls.on(Hls.Events.MANIFEST_PARSED, (_event, data) => {
					renderQualityOptions(data.levels || []);
					applyQualityPreference();
					setState("ready");
					if (resumeAt > 0) elements.video.currentTime = resumeAt;
				});

				hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, (_event, data) => {
					renderVoiceOptions(data.audioTracks || hls.audioTracks || []);
				});

				hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, (_event, data) => {
					const track = hls.audioTracks[data.id];
					if (!track) return;
					elements.voice.value = String(data.id);
					elements.voice.title = `Сейчас: ${track.name || track.lang || "Аудиодорожка"}`;
				});

				hls.on(Hls.Events.LEVEL_SWITCHED, (_event, data) => {
					const level = hls.levels[data.level];
					if (level) elements.quality.title = `Сейчас: ${qualityLabel(level)}`;
				});

				hls.on(Hls.Events.ERROR, async (_event, data) => {
					if (!data.fatal) return;
					if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
						hls.recoverMediaError();
						return;
					}
					if (!refreshAttempted && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
						refreshAttempted = true;
						await loadMovie(elements.video.currentTime || 0);
						return;
					}
					showError(new Error(data.details || "Ошибка воспроизведения HLS"));
				});

				hls.loadSource(url);
				hls.attachMedia(elements.video);
			}

			function qualityLabel(level) {
				if (level.width && level.height) return `${level.width}×${level.height}`;
				if (level.height) return `${level.height}p`;
				return `${Math.round((level.bitrate || 0) / 1000)} Кбит/с`;
			}

			function qualityKey(level) {
				return `${level.width || 0}x${level.height || 0}`;
			}

			function renderQualityOptions(levels) {
				elements.quality.replaceChildren(new Option("Auto"));
				const sorted = levels
					.map((level, index) => ({ level, index }))
					.sort((a, b) => (b.level.width * b.level.height || b.level.bitrate) - (a.level.width * a.level.height || a.level.bitrate));
				sorted.forEach(({ level, index }, position) => {
					elements.quality.add(new Option(`${qualityLabel(level)}`, String(index)));
				});
			}

			function applyQualityPreference() {
				if (!hls?.levels?.length) return;
				if (qualityPreference === "auto") {
					hls.currentLevel = -1;
					elements.quality.value = "auto";
					return;
				}
				let index =
					qualityPreference === "max"
						? hls.levels.reduce(
								(best, level, current) =>
									(level.width * level.height || level.bitrate) >
									(hls.levels[best].width * hls.levels[best].height || hls.levels[best].bitrate)
										? current
										: best,
								0,
							)
						: hls.levels.findIndex((level) => qualityKey(level) === qualityPreference);
				if (index < 0) index = 0;
				hls.currentLevel = index;
				hls.nextLevel = index;
				elements.quality.value = String(index);
				qualityPreference = qualityKey(hls.levels[index]);
				sessionStorage.setItem("kult-test-quality", qualityPreference);
			}

			function renderVoiceOptions(tracks) {
				elements.voice.replaceChildren();
				tracks.forEach((track, index) => {
					elements.voice.add(new Option(track.name || track.lang || `Дорожка ${index + 1}`, String(index)));
				});
				if (!tracks.length) {
					elements.voice.add(new Option("Одна дорожка", "0"));
					elements.voice.disabled = true;
					return;
				}
				elements.voice.disabled = tracks.length < 2;
				let selected = tracks.findIndex((track) => track.name === voicePreference);
				if (selected < 0) selected = tracks.findIndex((track) => track.default);
				if (selected < 0) selected = 0;
				hls.audioTrack = selected;
				elements.voice.value = String(selected);
				voicePreference = tracks[selected].name || tracks[selected].lang || `Дорожка ${selected + 1}`;
				sessionStorage.setItem(`kult-test-voice:${KINOPOISK_ID}`, voicePreference);
			}

			async function loadMovie(resumeAt = 0) {
				setState("loading", "Получаем свежий поток…", "Ссылка на видео создаётся заново для этой сессии.");
				try {
					const { movie, variant } = await resolveMovie();
					elements.title.textContent = movie.title || "Фильм";
					elements.video.poster = movie.posterUrl || variant.previewImageFilepath || "";
					attachStream(proxyStreamUrl(variant.filepath), resumeAt);
				} catch (error) {
					showError(error);
				}
			}

			function showError(error) {
				console.error(error);
				setState("error", "Не удалось загрузить видео", error?.message || String(error));
			}

			async function togglePlayback() {
				if (elements.video.paused) {
					try {
						await elements.video.play();
					} catch (error) {
						showError(error);
					}
				} else {
					elements.video.pause();
				}
			}

			function updateTime() {
				const duration = elements.video.duration;
				const current = elements.video.currentTime;
				elements.time.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
				if (Number.isFinite(duration) && !elements.timeline.matches(":active")) {
					elements.timeline.value = String((current / duration) * 100 || 0);
				}
			}

			function showControls() {
				elements.player.dataset.controls = "true";
				clearTimeout(controlsTimer);
				if (!elements.video.paused) {
					controlsTimer = setTimeout(() => {
						elements.player.dataset.controls = "false";
					}, 2200);
				}
			}

			function reactionWebsocketUrl() {
				const url = new URL(RESOLVER_ORIGIN);
				url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
				url.pathname = "/ws";
				url.search = "";
				url.hash = "";
				return url.href;
			}

			function joinReactionChannel() {
				if (reactionSocket?.readyState !== WebSocket.OPEN) return;
				reactionSocket.send(
					JSON.stringify({
						type: "TEST_REACTION_JOIN",
						channelId: reactionChannelId,
						userId: reactionUserId,
						name: "Пользователь",
					}),
				);
			}

			function connectReactions() {
				clearTimeout(reactionReconnectTimer);
				reactionSocket = new WebSocket(reactionWebsocketUrl());
				reactionSocket.addEventListener("open", joinReactionChannel);
				reactionSocket.addEventListener("message", (event) => {
					let message;
					try {
						message = JSON.parse(event.data);
					} catch {
						return;
					}
					if (message.type === "TEST_REACTION") spawnReaction(message);
					if (message.type === "TEST_PLAYER_ACTION") showPlayerNotice(message);
				});
				reactionSocket.addEventListener("close", () => {
					reactionReconnectTimer = setTimeout(connectReactions, 1500);
				});
				reactionSocket.addEventListener("error", () => reactionSocket.close());
			}

			function spawnReaction({ emoji }) {
				while (elements.reactionLayer.children.length >= 8) {
					elements.reactionLayer.firstElementChild?.remove();
				}
				const item = document.createElement("div");
				item.className = "reaction-float";
				item.style.setProperty("--right", `${16 + Math.round(Math.random() * 44)}px`);
				item.style.setProperty("--drift", `${-28 + Math.round(Math.random() * 56)}px`);

				const icon = document.createElement("span");
				icon.className = "reaction-float__emoji";
				icon.textContent = emoji;
				item.append(icon);
				elements.reactionLayer.append(item);
				item.addEventListener("animationend", () => item.remove(), { once: true });
			}

			function sendReaction(emoji) {
				setReactionPanel(false);
				if (reactionSocket?.readyState !== WebSocket.OPEN) {
					return;
				}
				const now = Date.now();
				if (now - lastReactionAt < 500) return;
				lastReactionAt = now;
				reactionSocket.send(JSON.stringify({ type: "TEST_REACTION", emoji }));
			}

			function sendPlayerAction(action) {
				if (reactionSocket?.readyState !== WebSocket.OPEN) return;
				reactionSocket.send(JSON.stringify({ type: "TEST_PLAYER_ACTION", action }));
			}

			function showPlayerNotice({ action, name }) {
				while (elements.playerNotices.children.length >= 3) {
					elements.playerNotices.firstElementChild?.remove();
				}
				const notice = document.createElement("div");
				notice.className = "player-notice";
				const actor = name || "Пользователь";
				notice.textContent = action === "play" ? `${actor} запустил воспроизведение` : `${actor} поставил на паузу`;
				elements.playerNotices.append(notice);
				notice.addEventListener("animationend", () => notice.remove(), { once: true });
			}

			function setReactionPanel(open) {
				elements.reactionPanel.hidden = !open;
				elements.reactionToggle.setAttribute("aria-expanded", String(open));
				elements.reactionToggle.setAttribute("aria-label", open ? "Закрыть реакции" : "Открыть реакции");
				if (open) {
					clearTimeout(controlsTimer);
					elements.player.dataset.controls = "true";
				}
			}

			elements.retry.addEventListener("click", () => {
				refreshAttempted = false;
				loadMovie();
			});
			elements.play.addEventListener("click", togglePlayback);
			elements.centerPlay.addEventListener("click", togglePlayback);
			elements.video.addEventListener("click", togglePlayback);
			elements.player.addEventListener("pointermove", showControls);
			elements.player.addEventListener("pointerleave", () => {
				if (!elements.video.paused) elements.player.dataset.controls = "false";
			});

			elements.video.addEventListener("play", () => {
				elements.player.dataset.state = "playing";
				elements.play.textContent = "Ⅱ";
				elements.play.setAttribute("aria-label", "Пауза");
				showControls();
				sendPlayerAction("play");
			});

			elements.video.addEventListener("pause", () => {
				if (elements.player.dataset.state !== "loading" && elements.player.dataset.state !== "error") {
					elements.player.dataset.state = "paused";
				}
				elements.play.textContent = "▶";
				elements.play.setAttribute("aria-label", "Воспроизвести");
				showControls();
				if (elements.player.dataset.state !== "loading" && elements.player.dataset.state !== "error") {
					sendPlayerAction("pause");
				}
			});

			elements.video.addEventListener("timeupdate", updateTime);
			elements.video.addEventListener("durationchange", updateTime);

			elements.timeline.addEventListener("input", () => {
				if (Number.isFinite(elements.video.duration)) {
					elements.video.currentTime = elements.video.duration * (Number(elements.timeline.value) / 100);
					updateTime();
				}
			});

			elements.volume.addEventListener("input", () => {
				elements.video.volume = Number(elements.volume.value);
			});
			elements.video.volume = Number(elements.volume.value);
			elements.voice.addEventListener("change", () => {
				const index = Number(elements.voice.value);
				const track = hls?.audioTracks?.[index];
				if (!track) return;
				hls.audioTrack = index;
				voicePreference = track.name || track.lang || `Дорожка ${index + 1}`;
				sessionStorage.setItem(`kult-test-voice:${KINOPOISK_ID}`, voicePreference);
				elements.voice.title = `Сейчас: ${voicePreference}`;
			});
			elements.quality.addEventListener("change", () => {
				if (!hls) return;
				if (elements.quality.value === "auto") {
					qualityPreference = "auto";
					hls.currentLevel = -1;
				} else {
					const index = Number(elements.quality.value);
					const level = hls.levels[index];
					if (!level) return;
					qualityPreference = qualityKey(level);
					hls.currentLevel = index;
					hls.nextLevel = index;
				}
				sessionStorage.setItem("kult-test-quality", qualityPreference);
			});

			elements.reactionToggle.addEventListener("click", () => setReactionPanel(elements.reactionPanel.hidden));
			elements.reactionPanel.addEventListener("click", (event) => {
				const button = event.target.closest("[data-reaction]");
				if (button) sendReaction(button.dataset.reaction);
			});

			elements.fullscreen.addEventListener("click", async () => {
				if (document.fullscreenElement) await document.exitFullscreen();
				else await elements.player.requestFullscreen();
			});

			document.addEventListener("keydown", (event) => {
				if (event.code === "Escape" && !elements.reactionPanel.hidden) {
					setReactionPanel(false);
					return;
				}
				if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
				if (event.code === "Space") {
					event.preventDefault();
					togglePlayback();
				}
				if (event.code === "ArrowLeft") elements.video.currentTime = Math.max(0, elements.video.currentTime - 10);
				if (event.code === "ArrowRight")
					elements.video.currentTime = Math.min(elements.video.duration || Infinity, elements.video.currentTime + 10);
			});

			connectReactions();
			loadMovie();
		</script>
	</body>
</html>
